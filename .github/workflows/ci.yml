name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: node --check frontend/dist/assets/app.js
      - run: cp .env.example .env
      - run: docker compose config --quiet
        env:
          ADMIN_TOKEN: ci-placeholder-not-for-production
      - run: docker build -t signal-atlas:ci .
