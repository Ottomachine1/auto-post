name: Dotnet workspace
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: autopost-local-only
          POSTGRES_DB: autopost
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: dotnet test AutoPost.sln -c Release
      - run: dotnet run --project tools/AutoPost.Tools -- migrate
      - run: dotnet run --project tools/AutoPost.Tools -- seed-demo
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm run test:e2e --prefix web
      - run: docker build -f deploy/Dockerfile.dotnet --target api -t auto-post-api:ci .
      - run: docker build -f deploy/Dockerfile.dotnet --target worker -t auto-post-worker:ci .
      - run: docker build -f deploy/Dockerfile.dotnet --target tools -t auto-post-tools:ci .
