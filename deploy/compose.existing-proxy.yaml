# Use alone: docker compose -f deploy/compose.existing-proxy.yaml --project-directory . up -d --build
services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /data/intelligence.db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:8000"
    volumes:
      - atlas-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  atlas-data:
