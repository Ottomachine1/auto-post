# Use alone: docker compose -f deploy/compose.existing-proxy.yaml --project-directory . up -d --build
services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /data/intelligence.db
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8000"
    volumes:
      - atlas-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  atlas-data:
